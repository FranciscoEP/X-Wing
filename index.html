<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-Wing: Asalto a la Estrella de la Muerte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <div class="frame">
        <canvas id="game" tabindex="0" aria-label="Juego X-Wing"></canvas>
        <p class="loading">Cargando…</p>
      </div>
      <ul class="controls">
        <li><kbd>WASD</kbd>/<kbd>←↑↓→</kbd> mover</li>
        <li><kbd>J</kbd>/<kbd>Espacio</kbd> disparar</li>
        <li><kbd>K</kbd> torpedo</li>
        <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
        <li><kbd>M</kbd> sonido</li>
        <li><button id="mute-button" type="button" aria-pressed="false">🔊 Sonido: sí</button></li>
      </ul>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
